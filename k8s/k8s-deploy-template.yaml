apiVersion: v1
kind: Service
metadata:
  name: fraud-service
spec:
  selector:
    app: fraud-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-service
  template:
    metadata:
      labels:
        app: fraud-service
    spec:
      serviceAccountName: cloudsql-sa
      containers:
        - name: fraud-service
          image: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/fraud-service:${SHORT_SHA}
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://127.0.0.1:5432/${DB_NAME}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "${DB_USER}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "${DB_PASS}"
        - name: cloud-sql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.2
          command: ["/cloud_sql_proxy"]
          args: ["-instances=${DB_CONNECTION_NAME}=tcp:5432"]
          # If you are not using Workload Identity, mount a service account key and enable credential_file:
          # volumeMounts:
          #   - name: cloudsql-instance-credentials
          #     mountPath: /secrets/cloudsql
          #     readOnly: true
          # args: ["-instances=${DB_CONNECTION_NAME}=tcp:5432","-credential_file=/secrets/cloudsql/credentials.json"]
      # volumes:
      #   - name: cloudsql-instance-credentials
      #     secret:
      #       secretName: cloudsql-sa
---
