apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: LoadBalancer
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service:${SHORT_SHA}
          ports:
            - containerPort: 8080
          env:
            - name: SERVICES_FRAUD
              value: "http://fraud-service:8081"
            - name: SERVICES_PAYMENT
              value: "http://payment-service:8082"