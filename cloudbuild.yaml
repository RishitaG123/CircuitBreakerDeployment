# Minimal Cloud Build pipeline: build images, push to Artifact Registry, create GKE cluster, deploy to GKE
steps:

# 1) Ensure Artifact Registry repository exists (idempotent)
- id: "create-artifact-repo"
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    echo "Ensuring Artifact Registry repo ${_REPOSITORY} exists in ${_REGION}..."
    gcloud artifacts repositories create "${_REPOSITORY}" --repository-format=docker --location="${_REGION}" --quiet || echo "artifact repo may already exist"

# 0) Build the Maven multi-module project at repo root so parent POM and modules are resolved
- id: "maven-root-build"
  name: 'gcr.io/cloud-builders/mvn'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    echo "Building Maven multi-module project at repository root (skipping tests)..."
    mvn -B -DskipTests clean package

# 2) Build and push images for each service
- id: "build-and-push-order"
  name: 'gcr.io/cloud-builders/docker'
  args: ['build','-t','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/order-service:$SHORT_SHA','./order-service']

- id: "push-order"
  name: 'gcr.io/cloud-builders/docker'
  args: ['push','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/order-service:$SHORT_SHA']

- id: "build-and-push-fraud"
  name: 'gcr.io/cloud-builders/docker'
  args: ['build','-t','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fraud-service:$SHORT_SHA','./fraud-service']

- id: "push-fraud"
  name: 'gcr.io/cloud-builders/docker'
  args: ['push','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fraud-service:$SHORT_SHA']

- id: "build-and-push-payment"
  name: 'gcr.io/cloud-builders/docker'
  args: ['build','-t','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/payment-service:$SHORT_SHA','./payment-service']

- id: "push-payment"
  name: 'gcr.io/cloud-builders/docker'
  args: ['push','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/payment-service:$SHORT_SHA']

# 3) Create (idempotent) GKE cluster
- id: "create-gke-cluster"
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    echo "Creating or verifying GKE cluster ${_CLUSTER_NAME} in zone ${_CLUSTER_ZONE}..."
    # create cluster if it doesn't exist; tolerate if it already exists
    gcloud container clusters describe "${_CLUSTER_NAME}" --zone "${_CLUSTER_ZONE}" >/dev/null 2>&1 || \
      gcloud container clusters create "${_CLUSTER_NAME}" --zone "${_CLUSTER_ZONE}" --num-nodes=3 --quiet

# 4) Get cluster credentials
- id: "get-credentials"
  name: 'gcr.io/cloud-builders/gcloud'
  args: ['container','clusters','get-credentials','${_CLUSTER_NAME}','--zone','${_CLUSTER_ZONE}']

# 5) Render k8s template and deploy to GKE
- id: "render-and-apply-k8s"
  name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e
    echo "Rendering k8s template k8s/k8s-deploy-template.yaml with envsubst..."
    # Export values used in the template
    export PROJECT_ID="$PROJECT_ID"
    export SHORT_SHA="$SHORT_SHA"
    export _REGION="${_REGION}"
    export _REPOSITORY="${_REPOSITORY}"
    # Render template (ensure envsubst is available in this image)
    envsubst < k8s/k8s-deploy-template.yaml > k8s-deploy.yaml
    echo "Applying k8s manifests..."
    kubectl apply -f k8s-deploy.yaml

# Images produced by this build
images:
- '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/order-service:$SHORT_SHA'
- '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fraud-service:$SHORT_SHA'
- '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/payment-service:$SHORT_SHA'

# Substitutions and defaults
substitutions:
  _REGION: "us-central1"
  _REPOSITORY: "microservices-repo"
  _CLUSTER_NAME: "cb-cluster"
  _CLUSTER_ZONE: "us-central1-a"

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
