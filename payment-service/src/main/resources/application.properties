server.port=8082

# PostgreSQL datasource (active)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update

# Ensure Spring runs data.sql against the PostgreSQL datasource
# - Always initialize SQL (not only for embedded DBs)
# - Defer datasource initialization until after JPA has created/updated the schema
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
